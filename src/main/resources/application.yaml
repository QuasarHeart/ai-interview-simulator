spring:
  application:
    name: Fuchuang
  servlet:
    multipart:
        max-file-size: 10MB
        max-request-size: 10MB
  threads:
    virtual:
      enabled: true # 虚拟线程，用于处理SSE流式传输的
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  mybatis:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  pagehelper:
    reasonable: true
    helper-dialect: mysql
  mail:
    host: smtp.qq.com
    username: 2979734778@qq.com
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
              port: 465
              class: javax.net.ssl.SSLSocketFactory
              fallback: false
          starttls:
            enable: true
          connectiontimeout: 5000 # 连接服务器超时 5s
          timeout: 5000           # 发送邮件超时 5s
          writetimeout: 5000      # 写入数据超时 5s

