name: Java CI/CD with Docker

on:
  push:
    branches: [  "Back-end-dev" ] 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Login to Docker-repo
      uses: docker/login-action@v3
      with:
        registry: ccr.ccs.tencentyun.com 
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ccr.ccs.tencentyun.com/${{ secrets.DOCKER_NAMESPACE }}/java-app:latest

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # 停止并删除旧容器
          docker stop my-app || true
          docker rm my-app || true
          # 拉取最新镜像
          docker pull ${{ secrets.DOCKER_USERNAME }}/java-app:latest
          # 启动新容器
          docker run -d --name java-app -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/java-app:latest
